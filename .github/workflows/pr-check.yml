name: PR Check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow syntax
        run: |
          echo "Validating GitHub Actions workflow files..."
          errors=0

          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            echo "Checking $f..."

            # Basic YAML syntax check
            if ! python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null; then
              echo "ERROR: Invalid YAML in $f"
              errors=$((errors + 1))
            fi

            # Check for required 'on' and 'jobs' keys
            if ! grep -q '^on:' "$f" && ! grep -q "^'on':" "$f" && ! grep -q '^"on":' "$f"; then
              echo "WARNING: Missing 'on' trigger in $f"
            fi

            if ! grep -q '^jobs:' "$f"; then
              echo "WARNING: Missing 'jobs' section in $f"
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "Found $errors workflow file(s) with errors"
            exit 1
          fi

          echo "All workflow files are valid"

  ci-check:
    name: CI Readiness Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "type=node" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "type=python" >> $GITHUB_OUTPUT
          else
            echo "type=other" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Every step below is deliberately WITHOUT `continue-on-error`. This job
      # previously carried it on the install, lint and test steps, which meant it
      # reported success no matter what happened -- a failing install, a lint
      # error or a red test suite all still produced a green check. See #16.
      #
      # `--ignore-scripts` is retained: it blocks lifecycle scripts from
      # untrusted dependency code on CI. Verified safe here -- `src/models/User.ts`
      # imports `bcrypt`, and the module loads with its install script skipped.
      - name: Install dependencies
        if: steps.detect.outputs.type == 'node'
        run: npm ci --ignore-scripts

      # `lint:ci` holds the warning count at a ceiling rather than letting it
      # drift. `npm run lint` alone exits 0 with warnings, so without a ceiling a
      # blocking lint step would still gate on nothing but errors.
      #
      # The ceiling only ratchets DOWNWARD by hand: fixing warnings does not
      # tighten it automatically, so the count can drift back up to the ceiling
      # unnoticed. Lower the number in the `lint:ci` script whenever warnings are
      # fixed, or it stops being a ratchet and becomes just a cap.
      - name: Run lint check
        if: steps.detect.outputs.type == 'node'
        run: npm run lint:ci --if-present

      - name: Run type check
        if: steps.detect.outputs.type == 'node'
        run: npm run typecheck --if-present

      - name: Run tests
        if: steps.detect.outputs.type == 'node'
        run: npm test --if-present

      - name: Build
        if: steps.detect.outputs.type == 'node'
        run: npm run build --if-present
