# gitleaks configuration. Extends the bundled default ruleset.
[extend]
useDefault = true

# Narrowly allowlist the placeholder/illustrative credentials used in
# documentation examples. Scoped to the specific patterns (matched against the
# whole line) rather than exempting all Markdown, so a real secret pasted into a
# doc would still be caught.
[allowlist]
description = "Documentation example placeholders, not real secrets"
regexTarget = "line"
regexes = [
  # API docs: `Authorization: Bearer YOUR_ACCESS_TOKEN`, `Bearer YOUR_TOKEN`,
  # `Bearer jwt-token-here`, `Bearer ${serviceToken}`, `Bearer <token>`
  '''Bearer\s+(YOUR_[A-Z_]+|jwt-token-here|\$\{?\w+\}?|<[^>]+>)''',
  # Illustrative constant in the naming-conventions standard
  '''abcdef123456''',
]
